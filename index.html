        #result { margin-top: 20px; display: none; }
        .winner-card { background: #fff0f5; border: 2px solid #d63384; border-radius: 12px; padding: 20px; margin: 15px 0; }

        { jp: "ザオ・シーミン", ko: "자오시밍", en: "ZHAO XIMING", group: "C" },
        { jp: "ザオ・ユードン", ko: "자오위둥", en: "ZHAO YUDONG", group: "C" },
        { jp: "ザオ・ユールイ", ko: "자오위루이", en: "ZHAO YURUI", group: "C" },
        { jp: "ザオ・ユージュン", ko: "자오위쥔", en: "ZHAO YUJUN", group: "C" },
        { jp: "ゾウ・ハン", ko: "저우한", en: "ZHOU HAN", group: "C" },
        { jp: "チェン・ジンホウ", ko: "천징후", en: "CHEN JINGHOU", group: "C" },
        { jp: "チェン・カイユアン", ko: "천카이위안", en: "CHEN KAIYUAN", group: "C" },
        { jp: "チェン・リン", ko: "천린", en: "CHEN LIN", group: "C" },
        { jp: "チェン・ユアン", ko: "천위안", en: "CHEN YUAN", group: "C" },
        { jp: "チェン・ズーハン", ko: "천쯔한", en: "ZIXUAN/CHEN", en: "C" },
        { jp: "ダオ・ラン", ko: "다오란", en: "DAO LAN", group: "C" },
        { jp: "ファン・ハオラン", ko: "황하오란", en: "HUANG HAORAN", group: "C" },
        { jp: "カン・ユエン2", ko: "캉위안", en: "KANG YUAN 2", group: "C" },
        { jp: "リー・ハイミン", ko: "리하이밍", en: "LI HAIMING", group: "C" },
        { jp: "リン・チーホウ2", ko: "린치후2", en: "LIN QIHOU 2", group: "C" },
        { jp: "ルオ・ジンユー", ko: "뤄징위", en: "LUO JINGYU", group: "C" },
        { jp: "ワン・ジンウク等重複整理", ko: "왕...", en: "WANG...", group: "C" },
        { jp: "ヤン・チーハオ2", ko: "양치하오2", en: "YANG QIHAO 2", group: "C" },
        { jp: "ザオ・ユアン", ko: "자오위안", en: "ZHAO YUAN", group: "C" },
        { jp: "ザオ・ユールイ2", ko: "자오위루이2", en: "ZHAO YURUI 2", group: "C" }
    ];

    let currentMode = 'ALL';
    let pool = [];
    let historyList = [];
    let totalRounds = 0;
    let currentRound = 0;

    function setMode(mode) {
        currentMode = mode;
        document.querySelectorAll('.selector button').forEach(b => b.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');
        restart();
    }

    function getFilteredList() {
        if (currentMode === 'K') return participants.filter(p => p.group === 'K');
        if (currentMode === 'C') return participants.filter(p => p.group === 'C');
        return [...participants];
    }

    function restart() {
        const source = getFilteredList();
        pool = [...source].sort(() => Math.random() - 0.5);
        totalRounds = pool.length;
        currentRound = 1;
        historyList = [];
        document.getElementById('battle-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';
        nextBattle();
    }

    function updateProgress() {
        document.getElementById('progress').innerText = `残り候補: ${pool.length + historyList.length*2} 人（サバイバル進行中）`;
    }

    function nextBattle() {
        if (pool.length < 2) {
            if (historyList.length === 0 && pool.length === 1) {
                showFinalWinner(pool[0]);
                return;
            } else if (pool.length === 1 && historyList.length > 0) {
                historyList.push(pool[0]);
                pool = [...historyList];
                historyList = [];
            } else if (pool.length === 0 && historyList.length > 0) {
                pool = [...historyList];
                historyList = [];
            }
        }

        if (pool.length < 2) {
            showResult();
            return;
        }

        updateProgress();
        renderCard(0, pool[0]);
        renderCard(1, pool);
    }

    function renderCard(idx, data) {
        const badge = document.getElementById('badge' + idx);
        badge.innerText = data.group + 'グループ';
        badge.className = 'badge ' + data.group;
        document.getElementById('nameJp' + idx).innerText = data.jp;
        document.getElementById('nameKo' + idx).innerText = data.ko;
        document.getElementById('nameEn' + idx).innerText = data.en;
    }

    function vote(choiceIdx) {
        const winner = choiceIdx === 0 ? pool[0] : pool;
        historyList.push(winner);
        pool.splice(0, 2);
        
        if (pool.length === 0) {
            pool = [...historyList];
            historyList = [];
        }

        if (pool.length === 1 && historyList.length === 0) {
            showFinalWinner(pool[0]);
        } else {
            nextBattle();
        }
    }

    function showFinalWinner(winner) {
        document.getElementById('battle-area').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        document.getElementById('winner-box').innerHTML = `
            <span class="badge ${winner.group}">${winner.group}グループ</span>
            <div style="font-size: 26px; font-weight: bold; margin: 10px 0; color: #d63384;">${winner.jp}</div>
            <div style="font-size: 14px; color: #555;">${winner.ko} / ${winner.en}</div>
        `;
    }

    function showResult() {
        showFinalWinner(pool[0]);
    }

    restart();
</script>
