<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOYS II PLANET 好き顔サバイバル</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --space-1: #030817;
            --space-2: #07152f;
            --space-3: #0b2147;

            --blue: #4db8ff;
            --blue-light: #9dddff;
            --cyan: #63f3ff;
            --purple: #8d7dff;

            --text: #f4f9ff;
            --muted: #91a8c7;

            --card: rgba(8, 25, 57, 0.88);
            --card-hover: rgba(15, 45, 91, 0.96);
            --line: rgba(99, 243, 255, 0.35);
            --glow: rgba(77, 184, 255, 0.35);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 28px 16px 50px;
            color: var(--text);
            font-family: 'Noto Sans JP', sans-serif;
            background:
                radial-gradient(circle at 15% 20%, rgba(77,184,255,.16) 0 1px, transparent 2px),
                radial-gradient(circle at 80% 15%, rgba(255,255,255,.9) 0 1px, transparent 2px),
                radial-gradient(circle at 62% 72%, rgba(99,243,255,.7) 0 1px, transparent 2px),
                radial-gradient(circle at 28% 88%, rgba(255,255,255,.8) 0 1px, transparent 2px),
                radial-gradient(circle at 92% 55%, rgba(141,125,255,.8) 0 1px, transparent 2px),
                linear-gradient(145deg, #020611 0%, #07142d 45%, #030817 100%);
            background-size: 180px 180px, 260px 260px, 220px 220px, 300px 300px, 240px 240px, auto;
            background-attachment: fixed;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(circle at 50% 0%, rgba(77,184,255,.13), transparent 38%),
                linear-gradient(transparent 0%, rgba(2,6,17,.18) 100%);
        }

        .container {
            position: relative;
            width: min(1050px, 100%);
            margin: 0 auto;
            padding: 34px;
            border: 1px solid rgba(99,243,255,.25);
            border-radius: 28px;
            background: rgba(3, 12, 30, .82);
            box-shadow:
                0 0 45px rgba(0, 90, 180, .16),
                inset 0 0 35px rgba(77,184,255,.035);
            backdrop-filter: blur(14px);
        }

        h1 {
            margin: 0;
            color: #eaf8ff;
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(20px, 4vw, 34px);
            letter-spacing: .08em;
            text-shadow: 0 0 18px rgba(99,243,255,.6);
        }

        .subtitle {
            margin: 10px 0 28px;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: .05em;
        }

        .selector {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 26px;
        }

        button {
            border: 1px solid rgba(99,243,255,.35);
            border-radius: 999px;
            padding: 11px 18px;
            color: #cfefff;
            background: rgba(10, 31, 66, .9);
            font-family: 'Orbitron', 'Noto Sans JP', sans-serif;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .03em;
            cursor: pointer;
            transition: .22s ease;
        }

        button:hover {
            transform: translateY(-2px);
            border-color: var(--cyan);
            box-shadow: 0 0 18px rgba(99,243,255,.22);
        }

        button.active {
            color: #02101e;
            border-color: var(--cyan);
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            box-shadow: 0 0 22px rgba(99,243,255,.35);
        }

        #progress {
            margin: 10px 0 18px;
            color: var(--blue-light);
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .04em;
            text-shadow: 0 0 10px rgba(77,184,255,.45);
        }

        .choices-container {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 820px;
            margin: 0 auto 20px;
        }

        .choice-card {
            width: 100%;
            min-width: 0;
            min-height: 330px;
            padding: 24px 18px 20px;
            border: 1px solid var(--line);
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(13,44,88,.94), rgba(4,16,38,.96));
            box-shadow:
                0 12px 30px rgba(0,0,0,.28),
                inset 0 0 25px rgba(77,184,255,.045);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            text-align: center;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .choice-card:hover {
            transform: translateY(-7px);
            border-color: var(--cyan);
            background: linear-gradient(160deg, rgba(16,56,108,.98), rgba(5,20,47,.98));
            box-shadow:
                0 16px 40px rgba(0,0,0,.35),
                0 0 28px rgba(77,184,255,.22);
        }

        .photo-frame {
            position: relative;
            width: 190px;
            height: 220px;
            margin-bottom: 16px;
            overflow: hidden;
            border-radius: 16px;
            border: 1px solid rgba(99,243,255,.5);
            background:
                radial-gradient(circle at 50% 35%, rgba(99,243,255,.15), transparent 42%),
                linear-gradient(145deg, #0c2852, #020a1c);
            box-shadow:
                0 0 22px rgba(77,184,255,.13),
                inset 0 0 20px rgba(99,243,255,.06);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(157,221,255,.7);
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            letter-spacing: .15em;
        }

        .photo-frame img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge {
            display: inline-block;
            margin-bottom: 7px;
            padding: 4px 12px;
            border-radius: 999px;
            font-family: 'Orbitron', sans-serif;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
        }

        .badge.K {
            color: #bcecff;
            background: rgba(77,184,255,.14);
            border: 1px solid rgba(77,184,255,.35);
        }

        .badge.C {
            color: #d9d0ff;
            background: rgba(141,125,255,.14);
            border: 1px solid rgba(141,125,255,.35);
        }

        .name-jp {
            margin: 3px 0;
            color: #f4f9ff;
            font-size: 17px;
            font-weight: 900;
            text-shadow: 0 0 9px rgba(77,184,255,.22);
        }

        .name-sub {
            margin: 2px 0;
            color: #91b1d5;
            font-size: 11px;
            letter-spacing: .04em;
        }

        .help-text {
            margin: 15px 0 0;
            color: #718aaa;
            font-size: 11px;
        }

        #result {
            display: none;
            margin-top: 25px;
        }

        #result h2 {
            color: #eaf8ff;
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 14px rgba(99,243,255,.45);
        }

        .result-subtitle {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 22px;
        }

        .grid-3x3 {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            max-width: 720px;
            margin: 20px auto;
        }

        .grid-item {
            position: relative;
            min-width: 0;
            padding: 14px 8px;
            border: 1px solid rgba(99,243,255,.2);
            border-radius: 16px;
            background: rgba(7, 25, 55, .85);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .grid-item.rank-1 {
            border: 2px solid var(--cyan);
            background: linear-gradient(145deg, rgba(12,58,101,.95), rgba(18,26,73,.95));
            box-shadow: 0 0 30px rgba(99,243,255,.24);
            transform: scale(1.04);
            z-index: 2;
        }

        .grid-item .photo-frame {
            width: 110px;
            height: 130px;
        }

        .grid-item.rank-1 .photo-frame {
            width: 130px;
            height: 150px;
        }

        .rank-badge {
            position: absolute;
            top: -10px;
            left: 10px;
            z-index: 3;
            padding: 3px 9px;
            border-radius: 999px;
            background: #061426;
            border: 1px solid rgba(99,243,255,.45);
            color: #bcecff;
            font-family: 'Orbitron', sans-serif;
            font-size: 9px;
            font-weight: 700;
        }

        .grid-item.rank-1 .rank-badge {
            color: #03111d;
            background: linear-gradient(135deg, var(--cyan), var(--blue));
        }

        .restart-btn {
            display: block;
            margin: 25px auto 0;
        }

        @media (max-width: 700px) {
            .container { padding: 22px 14px 30px; }
            .choices-container { grid-template-columns: 1fr; gap: 16px; }
            .choice-card { min-height: 300px; }
            .photo-frame { width: 155px; height: 185px; }
            .grid-3x3 { gap: 8px; }
            .grid-item .photo-frame { width: 85px; height: 105px; }
            .grid-item.rank-1 .photo-frame { width: 100px; height: 120px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>✦ BOYS II PLANET ✦</h1>
    <p class="subtitle">
        FACE SURVIVAL / YOUR PLANET 9
        <br>
        K + C から「顔だけ」で選ぶ、あなたのTOP 9
    </p>

    <div class="selector" id="modeSelector">
        <button onclick="startSession('K')" id="btn-K">K GROUP</button>
        <button onclick="startSession('C')" id="btn-C">C GROUP</button>
        <button onclick="startSession('ALL')" id="btn-ALL" class="active">ALL PLANET</button>
    </div>

    <div id="battle-area">
        <p id="progress">準備中...</p>
        <div class="choices-container" id="choicesBox"></div>
        <p class="help-text">✦ 一番「顔が刺さる」メンバーを選んでください ✦</p>
    </div>

    <div id="result">
        <h2>✦ YOUR PLANET TOP 9 ✦</h2>
        <p class="result-subtitle">あなたが選んだ9人のデビューフォーメーション</p>
        <div class="grid-3x3" id="debutGrid"></div>
        <button class="restart-btn" onclick="location.reload()">↻ START AGAIN</button>
    </div>
</div>

<script>
    // 参加者データリスト
    const participants = [
        { jp: "アークティック", ko: "아틱", en: "ARCTIC", group: "K" },
        { jp: "ジョウアンシン", ko: "조우안신", en: "ZHOU AN XIN", group: "C" }
        // ※必要に応じて他のメンバーデータをここに追加してください
    ];

    let currentPool = [];
    let selectedTop9 = [];

    function startSession(mode) {
        document.querySelectorAll('.selector button').forEach(button => button.classList.remove('active'));
        document.getElementById('btn-' + mode).classList.add('active');

        let source = [...participants];
        if (mode === 'K') {
            source = source.filter(person => person.group === 'K');
        } else if (mode === 'C') {
            source = source.filter(person => person.group === 'C');
        }

        currentPool = source.sort(() => Math.random() - 0.5);
        selectedTop9 = [];

        document.getElementById('battle-area').style.display = 'block';
        document.getElementById('result').style.display = 'none';

        nextRound();
    }

    function nextRound() {
        if (selectedTop9.length >= 9 || currentPool.length === 0) {
            showTop9Result();
            return;
        }

        if (currentPool.length <= 9 - selectedTop9.length) {
            selectedTop9.push(...currentPool);
            showTop9Result();
            return;
        }

        const currentBatch = currentPool
            .sort(() => Math.random() - 0.5)
            .slice(0, 2);

        document.getElementById('progress').innerText = 
            `ROUND ${selectedTop9.length + 1} / TOP 9 | 残り ${currentPool.length} 人`;

        const box = document.getElementById('choicesBox');
        box.innerHTML = '';

        currentBatch.forEach((item) => {
            const card = document.createElement('div');
            card.className = 'choice-card';
            card.onclick = () => chooseWinner(item, currentBatch);

            const photoHtml = item.img 
                ? `<div class="photo-frame"><img src="${item.img}" alt="${item.jp}"></div>`
                : `<div class="photo-frame">${item.jp.slice(0, 1)}</div>`;

            card.innerHTML = `
                ${photoHtml}
                <span class="badge ${item.group}">${item.group} GROUP</span>
                <div class="name-jp">${item.jp}</div>
                <div class="name-sub">${item.ko}</div>
                <div class="name-sub">${item.en}</div>
            `;
            box.appendChild(card);
        });
    }

    function chooseWinner(winner, currentBatch) {
        selectedTop9.push(winner);
        currentPool = currentPool.filter(person => !currentBatch.includes(person));
        nextRound();
    }

    function showTop9Result() {
        document.getElementById('battle-area').style.display = 'none';
        document.getElementById('result').style.display = 'block';

        const top9 = selectedTop9.slice(0, 9);
        const gridData = new Array(9).fill(null);

        // 真ん中(インデックス4)に1位を配置
        gridData[4] = top9[0];

        // 周囲の配置順
        const surroundingPositions = [0, 1, 2, 3, 5, 6, 7, 8];
        let rankIndex = 1;

        surroundingPositions.forEach(position => {
            if (rankIndex < top9.length) {
                gridData[position] = top9[rankIndex];
                rankIndex++;
            }
        });

        const gridBox = document.getElementById('debutGrid');
        gridBox.innerHTML = '';

        gridData.forEach((member, index) => {
            const cell = document.createElement('div');

            if (!member) {
                cell.className = 'grid-item';
                cell.innerHTML = '<div style="padding:30px;color:#5f7695;">—</div>';
                gridBox.appendChild(cell);
                return;
            }

            const isCenter = index === 4;
            cell.className = 'grid-item' + (isCenter ? ' rank-1' : '');
            const actualRank = top9.indexOf(member) + 1;

            const photoHtml = member.img 
                ? `<div class="photo-frame"><img src="${member.img}" alt="${member.jp}"></div>`
                : `<div class="photo-frame">${member.jp.slice(0, 1)}</div>`;

            cell.innerHTML = `
                <div class="rank-badge">
                    ${isCenter ? '★ CENTER / #1' : '#' + actualRank}
                </div>
                ${photoHtml}
                <span class="badge ${member.group}">${member.group} GROUP</span>
                <div class="name-jp">${member.jp}</div>
                <div class="name-sub">${member.en}</div>
            `;

            gridBox.appendChild(cell);
        });
    }

    // 初期起動
    startSession('ALL');
</script>

</body>
</html>
