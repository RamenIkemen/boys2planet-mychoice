        .badge.C { background: #fef3c7; color: #d97706; }

        .name-sub { font-size: 11px; color: #666; margin: 1px 0; }
        
        #progress { font-size: 14px; color: #d63384; margin-bottom: 15px; font-weight: bold; }
        #result { margin-top: 20px; display: none; }

const ROUND_TARGETS = [40, 20, 12, 8];
const ROUND_NAMES = ['1st ROUND', '2nd ROUND', '3rd ROUND', 'FINAL SURVIVAL'];

let mode = 'ALL';
let currentPool = [];
let nextPool = [];
let currentRound = 0;
let batches = [];
let batchIndex = 0;
let currentBatch = [];
let pickCount = 0;
let selected = [];

function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function getSource(modeName) {
    if (modeName === 'K') return participants.filter(p => p.group === 'K');
    if (modeName === 'C') return participants.filter(p => p.group === 'C');
    return [...participants];
}

function getTargets(poolLength) {
    // ALLは 80→40→20→12→8、K/Cも現在の人数から同じ最終目標へ。
    return ROUND_TARGETS.filter(n => n < poolLength || n === 8);
}

function makeBatches(pool) {
    // 1グループ最大9人。最後だけ8人などになることがあります。
    const count = Math.ceil(pool.length / 9);
    const base = Math.floor(pool.length / count);
    const extra = pool.length % count;
    const result = [];
    let pos = 0;
    for (let i = 0; i < count; i++) {
        const size = base + (i < extra ? 1 : 0);
        result.push(pool.slice(pos, pos + size));
        pos += size;
    }
    return result;
}

function allocatePickCounts(batchList, target) {
    // 各グループに何人選ぶかを、合計が必ずtargetになるように配分。
    const counts = [];
    let remainingPeople = batchList.reduce((sum, b) => sum + b.length, 0);
    let remainingTarget = target;

    batchList.forEach((batch, index) => {
        const remainingBatches = batchList.length - index;
        const minPick = Math.max(0, remainingTarget - (remainingPeople - batch.length));
        const maxPick = Math.min(batch.length, remainingTarget);
        const ideal = Math.round((remainingTarget * batch.length) / remainingPeople);
        let pick = Math.max(minPick, Math.min(maxPick, ideal));

        // このゲームでは毎グループ最低1人を選べる範囲なら1人以上にする。
        if (remainingTarget > 0 && remainingTarget >= remainingBatches) pick = Math.max(1, pick);
        pick = Math.min(pick, maxPick);

        counts.push(pick);
        remainingTarget -= pick;
        remainingPeople -= batch.length;
    });
    return counts;
}

function startSession(selectedMode) {
    mode = selectedMode;
    document.querySelectorAll('#modeSelector button').forEach(b => b.classList.remove('active'));
    const active = document.getElementById('btn-' + mode);
    if (active) active.classList.add('active');

    currentPool = shuffle(getSource(mode));
    currentRound = 0;
    nextPool = [];
    batches = [];
    batchIndex = 0;
    selected = [];

    document.getElementById('battle-area').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    startRound();
}

function startRound() {
    // すでに8人以下なら結果へ。
    if (currentPool.length <= 8) {
        showTop8Result();
        return;
    }

    // 現在人数に応じた次の目標。
    // 80→40→20→12→8、52→40→20→12→8、28→20→12→8 のように進む。
    let target = ROUND_TARGETS.find(n => n < currentPool.length);
    if (target == null) target = 8;

    nextPool = [];
    batches = makeBatches(shuffle(currentPool));
    const pickCounts = allocatePickCounts(batches, target);
    batches = batches.map((batch, i) => ({ members: batch, pick: pickCounts[i] }));
    batchIndex = 0;
    currentRound++;
    showNextBatch();
}

function showNextBatch() {
    if (batchIndex >= batches.length) {
        finishRound();
        return;
    }

    const data = batches[batchIndex];
    currentBatch = data.members;
    pickCount = data.pick;
    selected = [];
    renderBatch();
}

    box.innerHTML = '';

    const roundName = ROUND_NAMES[currentRound - 1] || 'FINAL SURVIVAL';

    currentBatch.forEach(item => {

        card.className = 'choice-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');

            : `<div class="photo-frame">${item.jp.slice(0, 1)}</div>`;

        card.innerHTML = `
            ${photo}
            <span class="badge ${item.group}">${item.group} GROUP</span>
            <div class="name-jp">${item.jp}</div>
            <div class="name-sub">${item.ko}</div>
            <div class="name-sub">${item.en}</div>
            <div class="select-mark">✓</div>
        `;

        card.onclick = () => toggleSelection(item, card);
        card.onkeydown = e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleSelection(item, card); }
        };
        box.appendChild(card);
    });

    const controls = document.createElement('div');
    controls.className = 'batch-controls';
    controls.innerHTML = `
        <div id="selectedCount" style="color:#888;font-size:12px;margin-bottom:9px">0 / ${pickCount}人 選択中</div>
        <button id="batchNextButton" class="restart-btn" disabled style="opacity:.4;cursor:not-allowed;margin-top:0">NEXT →</button>
    `;
    box.appendChild(controls);
    document.getElementById('batchNextButton').onclick = advanceBatch;
}

function toggleSelection(item, card) {
    const index = selected.indexOf(item);
    if (index >= 0) {
        selected.splice(index, 1);
        card.classList.remove('selected');
    } else {
        if (selected.length >= pickCount) return;
        selected.push(item);
        card.classList.add('selected');
    }

    const count = document.getElementById('selectedCount');
    const button = document.getElementById('batchNextButton');
    const ready = selected.length === pickCount;
    count.textContent = `${selected.length} / ${pickCount}人 選択中`;
    button.disabled = !ready;
    button.style.opacity = ready ? '1' : '.4';
    button.style.cursor = ready ? 'pointer' : 'not-allowed';
}

function advanceBatch() {
    if (selected.length !== pickCount) return;
    nextPool.push(...selected);
    batchIndex++;
    showNextBatch();
}

function finishRound() {
    const target = ROUND_TARGETS[currentRound - 1] || 8;
    // allocatePickCountsで通常ぴったりになる。念のため不足時のみ残りから補充。
    if (nextPool.length < target) {
        const used = new Set(nextPool);
        const leftovers = shuffle(batches.flatMap(b => b.members).filter(p => !used.has(p)));
        nextPool.push(...leftovers.slice(0, target - nextPool.length));
    }

    currentPool = shuffle(nextPool).slice(0, target);
    nextPool = [];

    if (currentPool.length <= 8) {
        showTop8Result();
    } else {
        startRound();
    }
}

function showTop8Result() {
    const top8 = shuffle(currentPool).slice(0, 8);
    document.getElementById('battle-area').style.display = 'none';
    document.getElementById('result').style.display = 'block';

    const grid = document.getElementById('debutGrid');
    grid.innerHTML = '';

    // 3×3の中央は空け、8人を周囲に配置。順位はこの方式では決めない。
    const positions = [0, 1, 2, 3, 5, 6, 7, 8];
    positions.forEach((position, i) => {
        const member = top8[i];
        const cell = document.createElement('div');
        cell.className = 'grid-item';
        const photo = member.img
            ? `<div class="photo-frame"><img src="${member.img}" alt="${member.jp}"></div>`
            : `<div class="photo-frame">${member.jp.slice(0, 1)}</div>`;
        cell.innerHTML = `
            <div class="rank-badge">TOP 8</div>
            ${photo}
            <span class="badge ${member.group}">${member.group} GROUP</span>
            <div class="name-jp">${member.jp}</div>
            <div class="name-sub">${member.ko}</div>
            <div class="name-sub">${member.en}</div>
        `;
        grid.appendChild(cell);
    });

    const center = document.createElement('div');
    center.className = 'grid-item center-message';
    center.innerHTML = '<div style="padding:25px 8px;color:#d63384;font-weight:900;letter-spacing:.08em;">✦ TOP 8 ✦</div>';
    grid.insertBefore(center, grid.children[4]);
}

startSession('ALL');
</script>
